<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>调经止痛方 Demo</title><style>

</style>
<style>

hadow:0 7px 24px #2f64731a}.thumb{width:88px;height:78px;border-radius:14px;background:linear-gradient(135deg,#d9b283,#8f5a36 55%,#3b261d)}.card h3{font-size:19px}.go{padding:11px 19px;box-shadow:0 5px 12px #18ad9f44}.section{padding:15px 17px}.section h2{font-size:21px;line-height:1.45}.chip{padding:11px 15px;border-radius:15px;background:#fff;box-shadow:0 3px 10px #33445d0b}.notice{padding:13px 18px;background:#e6fbfa;color:#079f9b;font-size:17px}.panel{margin:13px 11px;padding:16px;border-radius:21px;box-shadow:0 6px 20px #263b5510}.panel h2{font-size:23px}.option{padding:15px;border-radius:14px}.textarea{height:88px;background:#fafbfc}.bottom{padding:13px 17px 16px;background:#fffffff2;backdrop-filter:blur(12px);box-shadow:0 -5px 18px #3a52600c}.primary{padding:16px;border-radius:29px;background:linear-gradient(100deg,#18bdb2,#27c8bb);box-shadow:0 8px 18px #0eaa9f38}.chat{padding:16px}.bubble{padding:14px 16px;border-radius:18px;box-shadow:0 4px 14px #3240560c;font-size:17px}.rx{padding:16px;border-radius:21px;box-shadow:0 7px 20px #189c9418}.rxgrid{padding:11px;font-size:15px}.steps{width:300px;padding:28px 26px;border-radius:25px;background:#ffffffeb;backdrop-filter:blur(16px);box-shadow:0 22px 55px #0005;position:relative}.steps:before{content:"01 — 05";display:block;color:#16a9a0;font-size:12px;letter-spacing:2px;margin-bottom:8px}.steps h2{font-size:24px;margin-bottom:18px}.steps li{padding:17px 5px;font-size:16px}.hint{margin-top:24px;padding:12px 0 0;border-top:1px solid #e9edf2}@media(max-width:900px){.wrap{gap:28px;padding:30px}.wrap:before{left:32px}.phone{transform:scale(.86);transform-origin:center}.steps{width:260px}}
</style></head><body><div class="scene"><div class="phone"><div class="screen"><div class="island"></div><img id="screen" src="screen1.png"><div id="hot" class="hotspot s1" title="点击商品卡"></div></div></div><aside class="panel"><h1>调经止痛方 · 演示流程</h1><div class="step active"><span class="dot">1</span><span><b>搜索结果</b><small>查看调经止痛方并进入问诊</small></span></div><div class="step"><span class="dot">2</span><span><b>补充问诊信息</b><small>选择就诊人和主要问题</small></span></div><div class="step"><span class="dot">3</span><span><b>中医问诊开方</b><small>医生接诊并分析体质</small></span></div><div class="step"><span class="dot">4</span><span><b>处方确认</b><small>核对药味与剂数</small></span></div><div class="step"><span class="dot">5</span><span><b>确认订单</b><small>选择配送并提交支付</small></span></div><div class="tip">点击手机页面中的主要操作区域继续体验。页面按上传截图比例展示。</div></aside></div><script>let p=1;const screen=document.getElementById('screen'),hot=document.getElementById('hot'),steps=[...document.querySelectorAll('.step')];steps.forEach((el,i)=>el.onclick=()=>go(i+1));function go(n){p=n;screen.src='screen'+n+'.png';steps.forEach((s,i)=>s.classList.toggle('active',i===n-1));hot.className='hotspot '+(['','s1','s2','s3','s4','s5'][n]);hot.title=['','点击商品卡进入问诊','点击下一步','点击进入处方结果','点击确认处方','点击提交订单'][n];hot.onclick=()=>n===5?alert('演示订单已提交'):go(n+1)}hot.onclick=()=>go(2)</script></body></html>
